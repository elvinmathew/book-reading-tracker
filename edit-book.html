<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Book: Book Reading Tracker</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="wrap header-inner">
      <h1>Edit Book</h1>
      <a href="index.html" class="btn">Back to Dashboard</a>
    </div>
  </header>

  <main class="wrap">
    <p id="message" class="message" hidden></p>

    <form id="bookForm" class="form-card" novalidate>
      <div class="field">
        <label for="title">Title</label>
        <input type="text" id="title" name="title">
      </div>

      <div class="field">
        <label for="author">Author</label>
        <input type="text" id="author" name="author">
      </div>

      <div class="form-row">
        <div class="field">
          <label for="total_pages">Total Pages</label>
          <input type="number" id="total_pages" name="total_pages" min="1" step="1">
        </div>
        <div class="field">
          <label for="total_chapters">Total Chapters</label>
          <input type="number" id="total_chapters" name="total_chapters" min="1" step="1">
        </div>
      </div>

      <div class="form-row">
        <div class="field">
          <label for="per_day_goal">Pages Per Day Goal <span class="help">Optional</span></label>
          <input type="number" id="per_day_goal" name="per_day_goal" min="1" step="1">
        </div>
        <div class="field">
          <label for="rating">Rating <span class="help">Optional, 1 to 5</span></label>
          <select id="rating" name="rating">
            <option value="">Not rated</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="notes">Notes <span class="help">Optional</span></label>
        <textarea id="notes" name="notes"></textarea>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Save Changes</button>
      </div>
    </form>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/edit-book.js"></script>
</body>
</html>
